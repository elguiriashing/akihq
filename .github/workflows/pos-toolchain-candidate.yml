name: POS patched toolchain candidate
on:
  push:
    branches: [feature/pos-kitchen-display-20261018]
    paths: ['.github/workflows/pos-toolchain-candidate.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'elguiriashing/akihq' && github.ref == 'refs/heads/feature/pos-kitchen-display-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only the reviewed stable Wrangler upgrade
        run: |
          mkdir -p "$RUNNER_TEMP/pos-toolchain"
          npm view wrangler@4.149.0 version engines dependencies --json > "$RUNNER_TEMP/pos-toolchain/vendor-package.json"
          npm install --prefix cloudflare --save-dev --save-exact wrangler@4.149.0
          npm audit --prefix cloudflare --json > "$RUNNER_TEMP/pos-toolchain/audit.json" || test "$?" = 1
          node --input-type=module -e "import fs from 'node:fs';const audit=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pos-toolchain/audit.json'));if(!audit.metadata||audit.error||(audit.metadata.vulnerabilities.high||0)+(audit.metadata.vulnerabilities.critical||0)>0)throw Error('High/critical audit findings remain');"
          git diff --check
          git diff -- cloudflare/package.json cloudflare/package-lock.json > "$RUNNER_TEMP/pos-toolchain/dependency.patch"
      - name: Clean install, full application tests and local-only Worker compilation
        run: |
          npm ci --prefix cloudflare
          npm run check --prefix cloudflare > "$RUNNER_TEMP/pos-toolchain/full-check.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/pos-toolchain/full-check.log"; exit 1; }
          cd cloudflare
          ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/pos-toolchain/worker-build" > "$RUNNER_TEMP/pos-toolchain/worker-build.log" 2>&1 || { cat "$RUNNER_TEMP/pos-toolchain/worker-build.log"; exit 1; }
      - name: Export reviewed source objects, never a branch or deployment
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const dir=process.env.RUNNER_TEMP+'/pos-toolchain';
            const paths=['cloudflare/package.json','cloudflare/package-lock.json'];
            const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').sort();
            if(JSON.stringify(changed)!==JSON.stringify([...paths].sort()))throw Error('Unexpected files changed');
            const entries=[];
            for(const path of paths){const expected=cp.execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();const r=await github.rest.git.createBlob({...context.repo,encoding:'base64',content:fs.readFileSync(path).toString('base64')});if(r.data.sha!==expected)throw Error('Blob mismatch');entries.push({path,mode:'100644',type:'blob',sha:r.data.sha});fs.copyFileSync(path,dir+'/'+path.split('/').pop());}
            fs.writeFileSync(dir+'/source-objects.json',JSON.stringify({expected_head:context.sha,entries},null,2));
            await core.summary.addHeading('Patched toolchain candidate validated').addRaw('Review the dependency patch and source objects before publishing. No branch update, deployment or production data access was performed.').write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-toolchain-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pos-toolchain/*.json
            ${{ runner.temp }}/pos-toolchain/*.log
            ${{ runner.temp }}/pos-toolchain/*.patch
          retention-days: 7

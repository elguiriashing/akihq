name: One-time format Android OAuth callback
on:
  push:
    branches:
      - fix/android-oauth-branded-return-20261025
    paths:
      - .github/workflows/format-oauth-return-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only callback files
        run: npx prettier --write src/lib/android-return-page.ts src/lib/android-auth.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/android-return-page.ts src/lib/android-auth.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: run Prettier on Android auth callback"
            git push origin HEAD:${{ github.ref_name }}
          fi

name: Native account acceptance
on:
  pull_request:
    paths:
      [
        "src/**",
        "tests/shared-native*",
        "scripts/test-native-account-browser.mjs",
        ".github/workflows/native-account-acceptance.yml",
      ]
permissions:
  contents: read
concurrency:
  group: native-account-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-account:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-native-account-browser.mjs
      - name: AkiSelector login acceptance
        run: node scripts/test-workspace-selector-browser.mjs hq
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-account-${{ github.event.pull_request.head.sha }}
          path: test-results/native-account
          retention-days: 7

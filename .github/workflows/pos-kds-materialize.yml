name: Materialize reviewed KDS source objects
on:
  push:
    branches: [feature/pos-kitchen-display-20261018]
    paths: ['tools/.pos-kds-transfer/**', '.github/workflows/pos-kds-materialize.yml']
permissions:
  contents: write
concurrency:
  group: pos-kds-candidate-transfer
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'elguiriashing/akihq' && github.ref == 'refs/heads/feature/pos-kitchen-display-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified source patch on the candidate only
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,hashlib,json,subprocess,os
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          path=Path('tools/.pos-kds-transfer/meta.json');m=json.loads(path.read_text())
          git('merge-base','--is-ancestor',m['base_commit'],'HEAD')
          assert git('rev-parse',m['base_commit']+'^{tree}')==m['base_tree']
          assert not git('status','--porcelain')
          raw=gzip.decompress(base64.b64decode(''.join(Path(p).read_text() for p in m['parts']),validate=True))
          assert hashlib.sha256(raw).hexdigest()==m['patch_sha256']
          patch=Path(os.environ['RUNNER_TEMP'])/'kds-reviewed.patch';patch.write_bytes(raw)
          git('apply','--unidiff-zero','--check','--index',str(patch));git('apply','--unidiff-zero','--index',str(patch))
          assert sorted(git('diff','--cached','--name-only').splitlines())==sorted(m['paths'])
          remove=[str(path),*m['parts'],'.github/workflows/pos-kds-materialize.yml'];git('rm','--',*remove)
          git('diff','--cached','--check')
          assert git('write-tree')==m['result_tree'],'Materialized tree differs from tested local source'
          out=Path(os.environ['RUNNER_TEMP'])/'kds-evidence';out.mkdir()
          (out/'metadata.json').write_text(json.dumps({**m,'remove':remove}))
      - run: npm ci --prefix cloudflare
      - name: Verify materialized source before export
        run: |
          node --check assets/pos-kds.js
          node --check assets/hospitality-pos.js
          node --test tests/pos-kds.test.mjs tests/pos-kds-db.test.mjs tests/production-schema.test.mjs tests/pos-service.test.mjs
          node tests/pos-v4-smoke.cjs
          node tests/pos-mobile-checkout.cjs
          npm audit --prefix cloudflare --json > "$RUNNER_TEMP/kds-evidence/dependency-audit.json" || test "$?" = 1
      - name: Export content-addressed blobs only; no branch or commit write
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const dir=process.env.RUNNER_TEMP+'/kds-evidence';
            const m=JSON.parse(fs.readFileSync(dir+'/metadata.json','utf8'));
            if(context.repo.owner!=='elguiriashing'||context.repo.repo!=='akihq'||context.ref!=='refs/heads/feature/pos-kitchen-display-20261018')throw Error('Wrong source');
            if(cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim()!==m.result_tree)throw Error('Source changed during tests');
            const entries=[];
            for(const path of m.paths){const expected=cp.execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();const r=await github.rest.git.createBlob({...context.repo,encoding:'base64',content:fs.readFileSync(path).toString('base64')});if(r.data.sha!==expected)throw Error('Blob mismatch '+path);entries.push({path,mode:'100644',type:'blob',sha:r.data.sha});}
            for(const path of m.remove)entries.push({path,mode:'100644',type:'blob',sha:null});
            fs.writeFileSync(dir+'/tree-elements.json',JSON.stringify({expected_head:context.sha,result_tree:m.result_tree,entries},null,2));
            await core.summary.addHeading('Verified source objects exported').addRaw('No branch update, merge, deployment or production database change. Publish with the connected GitHub tools after checking the exact resulting tree.').write();
      - uses: actions/upload-artifact@v4
        with:
          name: pos-kds-source-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/kds-evidence/
          retention-days: 3

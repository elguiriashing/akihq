name: POS course candidate source export
on:
  push:
    branches: [dev/pos-course-materializer-20261018]
    paths: ['.github/workflows/pos-course-materialize.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover pinned candidate for local review without repository writes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-source"
          cp -r tools/course-candidate "$RUNNER_TEMP/course-candidate"
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'course-candidate'
          raw=base64.b64decode(''.join((d/f'part{n}.b64').read_text() for n in range(1,5)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='b9cccb005fadeb3aaa01a6e97fb2c81db807547c968c4c6973a4d33ee32bcf9e'
          (d/'candidate.patch').write_bytes(lzma.decompress(raw))
          PY
          git reset --hard d653c121b461f683a1d639e8c7057118b25c0a37
          git apply --index --unidiff-zero "$RUNNER_TEMP/course-candidate/candidate.patch"
          test "$(git write-tree)" = c4c9a865305c2334abf81de75158de7bb862ac76
          git diff --cached --check
          git archive --format=zip "$(git write-tree)" -o "$RUNNER_TEMP/course-source/candidate.zip"
          cp "$RUNNER_TEMP/course-candidate/candidate.patch" "$RUNNER_TEMP/course-source/"
          git write-tree > "$RUNNER_TEMP/course-source/tree.txt"
      - run: npm ci --prefix cloudflare
      - name: Export locked dependencies for isolated local regression tests
        run: tar -czf "$RUNNER_TEMP/course-source/test-dependencies.tar.gz" cloudflare/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pos-course-review-source-${{ github.sha }}
          path: ${{ runner.temp }}/course-source/
          retention-days: 3
          if-no-files-found: error

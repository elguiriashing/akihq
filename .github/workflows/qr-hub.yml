name: AkiSuite QR Hub checks

on:
  pull_request:
    paths:
      - 'qr-hub/**'
      - '.github/workflows/qr-hub.yml'
  push:
    branches: [main]
    paths:
      - 'qr-hub/**'
      - '.github/workflows/qr-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check qr-hub/worker.mjs
      - run: node --test qr-hub/worker.test.mjs

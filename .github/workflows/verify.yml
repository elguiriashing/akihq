name: Verify AkiHQ
on:
  pull_request:
  push:
    branches: [main, 'audit/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        working-directory: cloudflare
      - name: Reject known high or critical dependency advisories
        run: npm audit --audit-level=high
        working-directory: cloudflare
      - run: npm run check
        working-directory: cloudflare
      - name: Compile Worker locally without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-build"
        working-directory: cloudflare

name: POS course development source
on:
  push:
    branches: [feature/pos-course-control-20261018]
    paths: ['.github/workflows/pos-course-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export baseline and create migration through Supabase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/course-source"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/course-source/source.zip"
          npx --yes supabase@2.121.0 migration new --help
          npx --yes supabase@2.121.0 migration new pos_course_control
          cp supabase/migrations/*_pos_course_control.sql "$RUNNER_TEMP/course-source/"
          git rev-parse HEAD > "$RUNNER_TEMP/course-source/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pos-course-source-${{ github.sha }}
          path: ${{ runner.temp }}/course-source/
          retention-days: 3

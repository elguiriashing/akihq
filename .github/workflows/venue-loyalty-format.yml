name: Format Venue Loyalty PR
on:
  push:
    branches:
      - feature/venue-loyalty-workspace-20261021
    paths:
      - .github/workflows/venue-loyalty-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only changed loyalty files
        run: |
          npx prettier --write 'src/app/[locale]/business/page.tsx' 'src/app/[locale]/business/venue/[id]/page.tsx' 'src/app/[locale]/business/venue/[id]/actions.ts' src/components/VenueLoyaltyWorkspace.tsx tests/venue-loyalty-workspace.test.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/app/[locale]/business/page.tsx' 'src/app/[locale]/business/venue/[id]/page.tsx' 'src/app/[locale]/business/venue/[id]/actions.ts' src/components/VenueLoyaltyWorkspace.tsx tests/venue-loyalty-workspace.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(loyalty): format modified files'
            git push origin HEAD:refs/heads/feature/venue-loyalty-workspace-20261021
          fi

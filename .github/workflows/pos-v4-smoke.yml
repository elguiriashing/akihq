name: AkiHQ PoS smoke
on:
  pull_request:
    paths:
      - "assets/hospitality-pos.js"
      - "assets/pos-ledger.js"
      - "assets/pos-ledger.css"
      - "supabase/migrations/20261010223000_pos_trading_days_ledger.sql"
      - "tests/pos-ledger.test.mjs"
      - "assets/hospitality-pos.css"
      - "assets/pos-responsive.css"
      - "index.html"
      - "sw.js"
      - "assets/pos-v4.js"
      - "assets/pos-v4-dialogs.js"
      - "assets/pos-v4.css"
      - "assets/pos-printer-station.js"
      - "assets/pos-printer-station.css"
      - "tests/pos-v4-smoke.cjs"
      - "tests/pos-mobile-checkout.cjs"
      - "tests/pos-rapid-taps.test.mjs"
      - "tests/pos-printer-station.test.mjs"
      - ".github/workflows/pos-v4-smoke.yml"
  push:
    branches: [main]
    paths:
      - "assets/hospitality-pos.js"
      - "assets/pos-v4.js"
      - "assets/pos-v4-dialogs.js"
      - "tests/pos-v4-smoke.cjs"
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix cloudflare
      - run: node tests/pos-v4-smoke.cjs
      - run: node tests/pos-mobile-checkout.cjs
      - run: node --test tests/pos-rapid-taps.test.mjs
      - run: node --test tests/pos-printer-station.test.mjs
      - run: node --test tests/pos-ledger.test.mjs

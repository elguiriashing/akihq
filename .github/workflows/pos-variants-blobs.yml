name: POS variant candidate blob packaging
on:
  push:
    branches: [dev/pos-variants-blobs-20261019]
    paths: ['.github/workflows/pos-variants-blobs.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the hash-pinned reviewed source without changing repository refs
        run: |
          set -euo pipefail
          cp -r tools/variants-candidate "$RUNNER_TEMP/variants-candidate"
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'variants-candidate'
          raw=base64.b64decode(''.join((d/f'part{n}.b64').read_text() for n in range(1,5)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='ad5d6f247047628f385d3039543c62578a33f1e4dc1e8da4cb0daeb894157e34','Candidate transport digest mismatch'
          (d/'candidate.patch').write_bytes(lzma.decompress(raw))
          PY
          git reset --hard f64eadb22b9a82ae09b0bfe0e10f7e90ee1a3c97
          git apply --index "$RUNNER_TEMP/variants-candidate/candidate.patch"
          test "$(git write-tree)" = fb39ca3c5bdace3ccd8601d78bffc74bfc6e08b3
          git diff --cached --check
      - name: Package only immutable reviewed source blobs, not commits or deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/elguiriashing/akihq'
          paths=[p for p in subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=AM','-z']).decode().split('\0') if p]
          assert len(paths)==17,'Unexpected changed file count'
          assert all(not p.startswith('.github/') and not p.startswith('supabase/') for p in paths),'Unexpected privileged source path'
          result=[]
          for name in paths:
            raw=pathlib.Path(name).read_bytes()
            expected=subprocess.check_output(['git','hash-object',name]).decode().strip()
            payload=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
            req=urllib.request.Request(root+'/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=45) as r:created=json.load(r)
            assert created['sha']==expected,(name,'Blob hash mismatch')
            result.append({'path':name,'sha':expected,'mode':'100644','type':'blob'})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'variant-blobs';out.mkdir()
          (out/'manifest.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          print('No workflows, trees, commits, refs, deployments or business data were written.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pos-variant-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/variant-blobs/
          retention-days: 3
          if-no-files-found: error

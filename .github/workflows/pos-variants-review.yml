name: AkiBusiness inventory variants review
on:
  pull_request:
    paths: ['assets/**', 'tests/**', 'tools/**', 'index.html', 'sw.js', '.github/workflows/pos-variants-review.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pos-variants-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  variants-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare
      - name: Variant identity, server-owned prices, stock, permissions and retry regression
        run: |
          node --check assets/pos-variants.js
          node --check assets/pos-v4.js
          node --check assets/hospitality-pos.js
          node --test tests/pos-variants.test.mjs tests/pos-variants-db.test.mjs tests/pos-service.test.mjs tests/pos-courses.test.mjs tests/pos-kds.test.mjs tests/membership-navigation.test.mjs
          node tests/pos-v4-smoke.cjs
          node tests/pos-mobile-checkout.cjs
          node --test tests/pos-rapid-taps.test.mjs tests/pos-printer-station.test.mjs tests/pos-ledger.test.mjs
      - name: Verify the exact source in the paid AkiBusiness release
        run: |
          node tools/build-product-release.mjs "$RUNNER_TEMP/akibusiness-variants-release"
          node --input-type=module -e "import {readFileSync as read} from 'node:fs';const p=process.env.RUNNER_TEMP+'/akibusiness-variants-release/';const meta=JSON.parse(read(p+'release-source.json'));if(meta.product!=='AkiBusiness'||meta.sourceTreeDirty||meta.sourceCommit!==process.env.EXPECTED_HEAD)throw Error('Release source mismatch');for(const name of ['pos-variants.js?v=1','pos-variants.css?v=1','hospitality-pos.js?v=17','pos-v4.js?v=3'])if(!read(p+'index.html','utf8').includes(name)||!read(p+'sw.js','utf8').includes(name))throw Error('Missing versioned asset '+name);if(!read(p+'sw.js','utf8').includes('akihq-v125'))throw Error('Wrong paid-release cache');"
        env:
          NEXT_PUBLIC_AKISUITE_ROLE_SWAP: 'true'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: desktop
            sizes: '1280x800,1024x768'
          - id: tablet
            sizes: '800x1280,768x1024'
          - id: narrow
            sizes: '650x900,360x800'
          - id: short
            sizes: '320x640,900x500'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Fullscreen chooser and manager editor, native storage and focus
        env:
          POS_BROWSER_SIZES: ${{ matrix.sizes }}
        run: python tests/pos-variants-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-variants-browser-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/pos-variants/
          retention-days: 7
          if-no-files-found: warn

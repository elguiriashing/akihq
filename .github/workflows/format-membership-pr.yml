name: Format AkiHQ membership PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/akisuite-audience-memberships-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format changed membership sources with pinned Prettier
        run: npx prettier --write docs/EXTRACTION.md 'src/app/[locale]/business/memberships/page.tsx' 'src/app/[locale]/membership/page.tsx' 'src/app/[locale]/membership/membership.module.css' tests/product-routing.test.ts
      - name: Commit exact formatting results to the feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --update
            git commit -m "style: normalize AkiHQ membership release"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

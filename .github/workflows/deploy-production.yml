name: Manual AkiHQ production fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

concurrency:
  group: akihq-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AKISUITE_RELEASE_KIND: hq
      CLOUDFLARE_ACCOUNT_ID: 501bc9434d8ae555a6ac984a26dd2725
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source, tests and production destination
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          node scripts/brand-production-release.mjs prepare
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: akihq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: akihq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build exact independent source
        run: npm run build:cloudflare
      - name: Validate Worker bundle and exact source stamp
        run: |
          node scripts/brand-production-release.mjs config
          npx wrangler deploy --config .wrangler/brand-production.json --dry-run --outdir .wrangler/production-dry-run
      - name: Publish while preserving bindings and secrets
        run: npx wrangler deploy --config .wrangler/brand-production.json --keep-vars
      - name: Verify canonical source and product assets
        run: node scripts/brand-production-release.mjs verify

name: Rasterize AkiBusiness brand assets
on:
  push:
    branches: [brand/akibusiness-violet-20261017]
    paths:
      - 'assets/icons/icon.svg'
      - 'assets/icons/maskable.svg'
      - 'tools/render-brand-assets.mjs'
      - '.github/workflows/brand-assets.yml'
permissions:
  contents: write
jobs:
  raster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/brand-render" --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2
      - run: node tools/render-brand-assets.mjs
      - name: Commit raster favicon/PWA assets to candidate only
        run: |
          git add assets/icons/*.png assets/icons/favicon.ico
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render AkiBusiness SVG into matching PNG and ICO assets'
          git push origin HEAD:brand/akibusiness-violet-20261017
